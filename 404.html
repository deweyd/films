<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script type="text/javascript">
        var l = window.location;
        var pathArray = l.pathname.split('/');
        var repo = pathArray[1];
        var restOfPath = pathArray.slice(2).join('/');

        var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + repo + '/?p=' + encodeURIComponent(restOfPath) + l.hash;

        l.replace(newUrl);
    </script>
</head>
<body></body>
</html>
