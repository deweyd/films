<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script type="text/javascript">
        (function(l) {
            if (l.search[1] === 'p') {
                // Отримуємо значення після ?p=
                var p = l.search.slice(3).split('&')[0];
                // Формуємо чистий шлях без дублювання /films/
                var newPath = l.pathname.replace(/\/$/, '') + '/' + decodeURIComponent(p);
                window.history.replaceState(null, null, newPath + l.hash);
            }
        }(window.location))
    </script>
</head>
<body></body>
</html>
