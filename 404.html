<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script type="text/javascript">
        var l = window.location;
        // Отримуємо назву репозиторію (перший сегмент)
        var pathArray = l.pathname.split('/');
        var repo = pathArray[1];
        // Отримуємо все, що йде ПІСЛЯ репозиторію, і з'єднуємо назад через '/'
        var restOfPath = pathArray.slice(2).join('/');

        // Формуємо URL: /films/?p=MoviePage/299534
        var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + repo + '/?p=' + encodeURIComponent(restOfPath) + l.hash;

        l.replace(newUrl);
    </script>
</head>
<body></body>
</html>
