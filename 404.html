<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script type="text/javascript">
        var l = window.location;
        // Репозиторій: /films/ | Шлях: Genre/28
        // Отримуємо "/films"
        var repo = '/' + l.pathname.split('/')[1];
        // Отримуємо все, що йде після "/films/"
        var path = l.pathname.split('/').slice(2).join('/');

        // Перенаправляємо на /films/?p=Genre/28
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repo + '/?p=' + path + l.hash);
    </script>
</head>
<body></body>
</html>
